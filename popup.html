<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Authentic Hub</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 220px;
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafaf9;
      color: #2a2a28;
    }
    .brand {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9a9a94;
      margin-bottom: 10px;
    }
    .count {
      font-size: 40px;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 4px;
    }
    .label {
      font-size: 13px;
      color: #6b6b64;
      margin-bottom: 16px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6b6b64;
      margin-bottom: 16px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #8fbf8f;
    }
    button {
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 8px;
      background: #eeeeec;
      color: #2a2a28;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #e2e2df; }
  </style>
</head>
<body>
  <div class="brand">Authentic Hub · Zen Mode</div>
  <div class="count" id="count">0</div>
  <div class="label">AI posts quietly hidden this session</div>
  <div class="status"><span class="dot"></span><span>Watching your feed</span></div>
  <button id="reset">Reset counter</button>
  <script src="popup.js"></script>
</body>
</html>
